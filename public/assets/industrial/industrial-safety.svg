<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="is-t is-d">
  <title id="is-t">Technician performing an LPG regulator and manifold safety check</title>
  <desc id="is-d">A technician in helmet, gloves and high-visibility jacket inspecting a commercial LPG cylinder manifold with a leak-detection gauge.</desc>
  <defs>
    <linearGradient id="is-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3f6d"/><stop offset=".6" stop-color="#14568f"/><stop offset="1" stop-color="#1c6fb0"/>
    </linearGradient>
    <linearGradient id="is-cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07497f"/><stop offset=".3" stop-color="#42a3e6"/><stop offset=".6" stop-color="#0d69b5"/><stop offset="1" stop-color="#053c68"/>
    </linearGradient>
    <linearGradient id="is-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5b78"/><stop offset="1" stop-color="#1b3049"/>
    </linearGradient>
    <radialGradient id="is-spot" cx=".38" cy=".42" r=".62">
      <stop offset="0" stop-color="#ffd21c" stop-opacity=".28"/><stop offset="1" stop-color="#ffd21c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#is-bg)"/>
  <rect width="1200" height="800" fill="url(#is-spot)"/>
  <g stroke="#ffffff" stroke-width="3" opacity=".06" fill="none">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200"/>
    <path d="M160 0v560M400 0v560M640 0v560M880 0v560M1120 0v560"/>
  </g>

  <g opacity=".28" stroke="#9fdcff" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M0 116h380a40 40 0 0 1 40 40v90"/>
    <path d="M1200 96H860a40 40 0 0 0-40 40v70"/>
  </g>

  <rect y="560" width="1200" height="240" fill="url(#is-floor)"/>
  <path d="M0 560h1200" stroke="#5c7ea3" stroke-width="5"/>
  <g fill="#ffd21c" opacity=".22">
    <path d="M60 600h60l-30 60zM200 600h60l-30 60zM340 600h60l-30 60zM940 600h60l-30 60zM1080 600h60l-30 60z"/>
  </g>

  <g transform="translate(690 300)">
    <ellipse cx="176" cy="290" rx="230" ry="26" fill="#04182c" opacity=".45"/>
    <g transform="translate(0 100)">
      <rect width="88" height="184" rx="27" fill="url(#is-cyl)"/>
      <rect y="126" width="88" height="24" fill="#ffd21c"/>
      <rect x="27" y="-24" width="34" height="28" rx="8" fill="#8fa6bb"/>
      <rect x="15" y="-34" width="58" height="12" rx="6" fill="#647d94"/>
    </g>
    <g transform="translate(112 100)">
      <rect width="88" height="184" rx="27" fill="url(#is-cyl)"/>
      <rect y="126" width="88" height="24" fill="#ffd21c"/>
      <rect x="27" y="-24" width="34" height="28" rx="8" fill="#8fa6bb"/>
      <rect x="15" y="-34" width="58" height="12" rx="6" fill="#647d94"/>
    </g>
    <g transform="translate(224 100)">
      <rect width="88" height="184" rx="27" fill="url(#is-cyl)"/>
      <rect y="126" width="88" height="24" fill="#ffd21c"/>
      <rect x="27" y="-24" width="34" height="28" rx="8" fill="#8fa6bb"/>
      <rect x="15" y="-34" width="58" height="12" rx="6" fill="#647d94"/>
    </g>
    <g stroke="#a5bbcf" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M22 62h268"/><path d="M44 62v34M156 62v34M268 62v34"/><path d="M290 62h50a26 26 0 0 0 26-26V-30"/>
    </g>
    <circle cx="366" cy="-46" r="34" fill="#eef5fb" stroke="#647d94" stroke-width="6"/>
    <circle cx="366" cy="-46" r="22" fill="#ffffff"/>
    <path d="M366 -46l14-14" stroke="#c8102e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="366" cy="-46" r="4" fill="#0f4577"/>
    <rect x="-22" y="284" width="380" height="16" rx="8" fill="#41586e"/>
  </g>

  <g transform="translate(286 214)">
    <ellipse cx="160" cy="378" rx="132" ry="20" fill="#04182c" opacity=".45"/>

    <!-- legs and safety boots -->
    <path d="M126 268h30v96h-30zM172 268h30v96h-30z" fill="#1b3049"/>
    <path d="M118 352h40v26h-40zM170 352h40v26h-40z" fill="#0d1f31"/>
    <path d="M112 364h48a6 6 0 0 1 6 6v8h-54zM164 364h48a6 6 0 0 1 6 6v8h-54z" fill="#080f18"/>

    <!-- torso in high-visibility jacket -->
    <path d="M116 278V172a48 48 0 0 1 96 0v106z" fill="#ffd21c"/>
    <path d="M116 208h96v13h-96zM116 240h96v13h-96z" fill="#ffffff" opacity=".72"/>
    <path d="M150 130h28v148h-28z" fill="#f6c200" opacity=".55"/>
    <path d="M164 132l-11 20 11 16 11-16z" fill="#0f4577" opacity=".35"/>

    <!-- neck and head -->
    <rect x="150" y="106" width="28" height="24" rx="10" fill="#dfa87a"/>
    <circle cx="164" cy="82" r="36" fill="#f0c9a4"/>
    <path d="M128 92a36 36 0 0 0 6 16h-10a10 10 0 0 1 4-16z" fill="#dfa87a"/>

    <!-- safety helmet -->
    <path d="M126 74a38 38 0 0 1 76 0z" fill="#ffd21c"/>
    <path d="M118 74h92a6 6 0 0 1 0 12h-92a6 6 0 0 1 0-12z" fill="#f0b800"/>
    <path d="M158 40h12v34h-12z" fill="#ffe271" opacity=".8"/>

    <!-- right arm reaching the manifold with a gas detector -->
    <path d="M206 186l112 42a20 20 0 0 1-14 38l-112-42z" fill="#ffd21c"/>
    <path d="M240 198l60 22-5 14-60-22z" fill="#ffffff" opacity=".6"/>
    <rect x="300" y="222" width="46" height="42" rx="14" fill="#1c6fb0"/>
    <rect x="316" y="196" width="30" height="42" rx="8" fill="#eef5fb" stroke="#647d94" stroke-width="4"/>
    <rect x="322" y="204" width="18" height="14" rx="3" fill="#5be08a"/>

    <!-- left arm holding a checklist board -->
    <path d="M122 186l-40 46a20 20 0 0 0 26 30l40-46z" fill="#ffd21c"/>
    <rect x="70" y="248" width="42" height="40" rx="13" fill="#1c6fb0"/>
    <g transform="rotate(-10 60 274)">
      <rect x="24" y="240" width="70" height="88" rx="8" fill="#ffffff"/>
      <rect x="44" y="232" width="30" height="14" rx="6" fill="#8fa6bb"/>
      <g fill="#0057a8" opacity=".55"><rect x="36" y="264" width="46" height="7" rx="3"/><rect x="36" y="282" width="34" height="7" rx="3"/><rect x="36" y="300" width="42" height="7" rx="3"/></g>
    </g>
  </g>

  <g transform="translate(58 92)">
    <rect width="216" height="150" rx="18" fill="#ffffff" opacity=".95"/>
    <path d="M108 30l64 26v40c0 34-26 48-64 58-38-10-64-24-64-58V56z" fill="#0057a8"/>
    <path d="M86 96l16 16 30-32" stroke="#ffd21c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
